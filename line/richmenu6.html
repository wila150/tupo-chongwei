<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:2500px;height:1686px;background:#2a2a2a;font-family:'Noto Sans TC',sans-serif;color:#f4f1ea}
.g{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;width:100%;height:100%}
.t{background:#161616;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;position:relative;overflow:hidden}
.t:after{content:'';position:absolute;left:0;bottom:0;width:100%;height:12px;background:#d7262e}
.ic{width:200px;height:200px;color:#d7262e;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zh{font-size:112px;font-weight:900;letter-spacing:6px;position:relative}
.en{font-family:Oswald;font-size:50px;letter-spacing:10px;color:#d7262e;position:relative}
.big{justify-content:flex-end;padding-bottom:70px;gap:12px}
.big .art{position:absolute;inset:0;background:url(bear-art.png) center 18%/cover}
.big .art:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(168,22,29,.96) 0%,rgba(168,22,29,.75) 30%,rgba(0,0,0,0) 62%)}
.big .en{color:#fff}
.big:after{background:#fff}
.mk{width:250px;height:250px;object-fit:contain}
</style></head><body><div class="g">
<div class="t big"><div class="art"></div><div class="zh">預約私人課</div><div class="en">BOOK NOW</div></div>
<div class="t"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg><div class="zh">我的堂數</div><div class="en">MY CLASS</div></div>
<div class="t"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M7 13h3M7 17h3M14 13h3"/></svg><div class="zh">固定課表</div><div class="en">SCHEDULE</div></div>
<div class="t"><svg class="ic" viewBox="0 0 24 24"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2zM12 21V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg><div class="zh">首次體驗</div><div class="en">FIRST TRIAL</div></div>
<div class="t"><img class="mk" src="logo-bear.png"><div class="zh">關於教練</div><div class="en">COACH</div></div>
<div class="t"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg><div class="zh">聯絡教練</div><div class="en">CONTACT</div></div>
</div></body></html>
