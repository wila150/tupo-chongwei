<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:2500px;height:1686px;background:#2a2a2a;font-family:'Noto Sans TC',sans-serif;color:#f4f1ea}
.g{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;width:100%;height:100%}
.t{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative;overflow:hidden}
.t:after{content:'';position:absolute;left:0;bottom:0;width:100%;height:12px;background:#f0b429}
.ic{width:190px;height:190px;color:#f0b429;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zh{font-size:108px;font-weight:900;letter-spacing:6px}
.en{font-family:Oswald;font-size:46px;letter-spacing:10px;color:#f0b429}
.hot{background:#d7262e}.hot .ic,.hot .en{color:#fff}.hot:after{background:#fff}
.tag{position:absolute;top:34px;left:40px;font-family:Oswald;font-size:40px;letter-spacing:8px;color:#111;background:#f0b429;padding:6px 22px;border-radius:12px}
.hot .tag{display:none}
</style></head><body><div class="g">
<div class="t"><span class="tag">COACH</span><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/><path d="m9 15 2 2 4-4"/></svg><div class="zh">今天的課</div><div class="en">TODAY</div></div>
<div class="t hot"><svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><div class="zh">待確認預約</div><div class="en">PENDING</div></div>
<div class="t"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M8 14h8M8 17h5"/></svg><div class="zh">明天的課</div><div class="en">TOMORROW</div></div>
<div class="t"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/></svg><div class="zh">學員堂數</div><div class="en">CREDITS</div></div>
<div class="t"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg><div class="zh">LINE 訊息</div><div class="en">INBOX</div></div>
<div class="t"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="m7 11 3-3 3 3 4-4"/></svg><div class="zh">開啟後台</div><div class="en">ADMIN</div></div>
</div></body></html>
