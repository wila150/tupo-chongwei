<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>學員預約｜突破重圍</title>
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202611081522">
  <style>
    [hidden] { display: none !important; }
    body { padding: 0 0 calc(76px + env(safe-area-inset-bottom)); min-height: 100svh; }
    .m-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: .7rem 1rem; background: rgba(14,14,14,.96); border-bottom: 1px solid #222; }
    .m-top .nav-brand img { width: 38px; height: 38px; }
    .pill { background: var(--red); color: #fff; font-weight: 900; border-radius: 999px; padding: .3rem .9rem; font-size: .9rem; }
    .pill b { font-family: var(--display); font-size: 1.1rem; margin: 0 .15rem; }
    main { padding: 1rem; max-width: 560px; margin: 0 auto; }
    .center-box { text-align: center; padding: 18vh 1rem 0; color: var(--muted); }
    .week { display: flex; align-items: center; gap: .3rem; margin-bottom: .6rem; }
    .week-days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: .3rem; }
    .wd { background: none; border: 0; color: var(--paper); border-radius: 12px; padding: .45rem 0; font: inherit; cursor: pointer; display: grid; gap: .1rem; }
    .wd small { color: var(--muted); font-size: .72rem; }
    .wd b { font-family: var(--display); font-size: 1.2rem; }
    .wd.active { background: var(--red); }
    .wd.active small { color: #fff; }
    .wd:disabled { opacity: .3; }
    .wd .dot { width: 5px; height: 5px; border-radius: 50%; background: #2fbf71; margin: 0 auto; visibility: hidden; }
    .wd.has .dot { visibility: visible; }
    .arrow { background: none; border: 1px solid #333; color: var(--paper); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; flex: none; }
    .arrow:disabled { opacity: .25; }
    .day-title { color: var(--muted); font-size: .9rem; margin: .8rem 0 .5rem; }
    .slot-card { display: grid; grid-template-columns: 64px 1fr auto; gap: .9rem; align-items: center; background: var(--ink-2); border: 1px solid #2a2a2a; border-radius: 14px; padding: .9rem 1rem; margin-bottom: .6rem; }
    .slot-card .t { font-family: var(--display); font-size: 1.35rem; line-height: 1.1; }
    .slot-card .t small { display: block; color: var(--muted); font-size: .8rem; font-family: var(--font); }
    .slot-card h4 { font-size: 1rem; }
    .slot-card p { color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .slot-card .chip { display: inline-block; border: 1px solid #444; border-radius: 6px; padding: 0 .4rem; font-size: .75rem; color: var(--paper); margin-top: .25rem; }
    .slot-card .btn { padding: .5rem 1rem; font-size: .9rem; }
    .slot-card.full { opacity: .45; }
    .les { display: flex; justify-content: space-between; align-items: center; gap: 1rem; background: var(--ink-2); border: 1px solid #2a2a2a; border-left: 4px solid #2fbf71; border-radius: 12px; padding: .9rem 1rem; margin-bottom: .6rem; }
    .les b { font-family: var(--display); font-size: 1.2rem; }
    .les small { display: block; color: var(--muted); }
    .les .btn { padding: .4rem .9rem; font-size: .85rem; }
    .sec-title { font-size: 1.1rem; margin: 1.2rem 0 .7rem; }
    .stat { background: linear-gradient(135deg, #d7262e, #8f1218); border-radius: 18px; padding: 1.3rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .stat div small { display: block; opacity: .85; font-size: .8rem; }
    .stat div b { font-family: var(--display); font-size: 2.2rem; line-height: 1.1; }
    .row-log { display: grid; grid-template-columns: 70px 1fr auto; gap: .6rem; padding: .6rem 0; border-bottom: 1px solid #222; font-size: .9rem; }
    .row-log span:first-child { color: var(--muted); }
    .neg { color: var(--red); } .pos { color: #2fbf71; }
    .pk { background: var(--ink-2); border: 1px solid #2a2a2a; border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: .7rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .pk b { font-size: 1.05rem; }
    .pk small { display: block; color: var(--muted); }
    .pk .price { font-family: var(--display); font-size: 1.4rem; color: var(--paper); }
    .bind { background: var(--ink-2); border: 1px solid #2a2a2a; border-radius: 16px; padding: 1.4rem; margin-top: 1rem; }
    .bind h2 { font-size: 1.3rem; margin-bottom: .3rem; }
    .inp { width: 100%; background: var(--ink); color: var(--paper); border: 1px solid #333; border-radius: 10px; padding: .75rem .9rem; font: inherit; margin-top: .3rem; }
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(14,14,14,.98); border-top: 1px solid #222; padding: .4rem 0 calc(.4rem + env(safe-area-inset-bottom)); }
    .tabbar button { background: none; border: 0; color: var(--muted); font: inherit; font-size: .75rem; display: grid; justify-items: center; gap: .15rem; cursor: pointer; }
    .tabbar svg { width: 24px; height: 24px; }
    .tabbar button.active { color: var(--red); }
    .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { width: min(560px, 100%); background: var(--ink-2); border-radius: 20px 20px 0 0; padding: 1.4rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom)); }
    .sheet h3 { font-size: 1.2rem; margin-bottom: .4rem; }
    .sheet p { color: var(--muted); margin-bottom: 1rem; }
    .sheet .big { font-family: var(--display); font-size: 1.8rem; color: var(--paper); margin: .3rem 0 .8rem; }
    .sheet .acts { display: grid; grid-template-columns: 1fr 2fr; gap: .7rem; }
    .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: #2b2420; color: #fff; padding: .8rem 1.3rem; border-radius: 999px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.5); white-space: nowrap; }
    .err { color: var(--red); margin-top: .6rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <header class="m-top">
    <a href="./" class="nav-brand"><img src="img/logo-bear.png" alt=""><span>突破<em>重圍</em></span></a>
    <span class="pill" id="creditPill" hidden>剩<b id="creditNum">0</b>堂</span>
  </header>

  <main>
    <div class="center-box" id="loading">讀取中…</div>

    <!-- 綁定 -->
    <section id="bindView" hidden>
      <div class="bind">
        <h2>嗨 <span id="lineName"></span>！</h2>
        <p class="muted">第一次使用，留下<b>姓名和手機</b>就好，之後打開就能直接預約，不用再填。</p>
        <form id="bindForm" style="margin-top:1rem">
          <label class="field">姓名<input name="name" class="inp" required maxlength="30" autocomplete="name"></label>
          <label class="field" style="margin-top:.7rem">手機<input name="phone" class="inp" required inputmode="tel" maxlength="20" autocomplete="tel" placeholder="09xx-xxx-xxx"></label>
          <p class="err" id="bindErr"></p>
          <button class="btn btn-block" style="margin-top:.4rem">開始預約</button>
        </form>
      </div>

    </section>

    <!-- 預約 -->
    <section id="tab-book" data-tab hidden>
      <div class="week">
        <button class="arrow" id="prevWeek" aria-label="上一週">‹</button>
        <div class="week-days" id="weekDays"></div>
        <button class="arrow" id="nextWeek" aria-label="下一週">›</button>
      </div>
      <p class="day-title" id="dayTitle"></p>
      <div id="slotList"></div>
    </section>

    <!-- 我的課 -->
    <section id="tab-lessons" data-tab hidden>
      <h2 class="sec-title">已預約的課</h2>
      <div id="lessonList"></div>
      <p class="muted" style="font-size:.85rem;margin-top:1rem" id="cancelNote"></p>
    </section>

    <!-- 方案 -->
    <section id="tab-plans" data-tab hidden>
      <h2 class="sec-title">課程方案</h2>
      <div id="planList"></div>
      <p class="muted" style="font-size:.85rem;margin-top:.6rem">點「購買」會傳 LINE 給教練，付款後教練會幫你加堂數。</p>
    </section>

    <!-- 我的 -->
    <section id="tab-me" data-tab hidden>
      <div class="stat">
        <div><small>剩餘堂數</small><b id="meCredits">0</b></div>
        <div><small>方案到期</small><b id="meExp" style="font-size:1.4rem">—</b></div>
      </div>
      <h2 class="sec-title">堂數紀錄</h2>
      <div id="ledgerList"></div>
      <a class="btn btn-ghost btn-block" id="contactCoach" target="_blank" rel="noopener" style="margin-top:1.4rem">聯絡教練</a>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-go="book" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>預約</button>
    <button data-go="lessons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>我的課</button>
    <button data-go="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>方案</button>
    <button data-go="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</button>
  </nav>

  <div class="sheet-bg" id="sheet" hidden>
    <div class="sheet">
      <h3>確認預約</h3>
      <div class="big" id="sheetWhen"></div>
      <p id="sheetInfo"></p>
      <p class="err" id="sheetErr"></p>
      <div class="acts"><button class="btn btn-ghost" id="sheetNo">再想想</button><button class="btn" id="sheetYes">確認預約</button></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="data.js?v=202611081522"></script>
  <script type="module" src="member.js?v=202611081522"></script>
</body>
</html>
