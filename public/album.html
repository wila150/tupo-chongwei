<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>相簿｜突破重圍 BREAK THROUGH</title>
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202611081635">
  <style>
    html, body { overflow-x: hidden; max-width: 100%; }
    .al-wrap { width: min(1120px, 92%); margin: 0 auto; padding: 6.5rem 0 4rem; }
    .al-back { display: inline-flex; margin-bottom: 1.4rem; }
    .al-title { font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.15; letter-spacing: .04em; }
    .al-tags { display: flex; gap: .5rem; margin: .9rem 0 1.2rem; flex-wrap: wrap; }
    .al-tags span { border: 1px solid #3a3a3a; border-radius: 999px; padding: .2rem .8rem; font-size: .85rem; color: var(--muted); }
    .al-tags span:first-child { border-color: var(--red); color: var(--paper); }
    .al-desc { color: #d6cfc4; max-width: 720px; white-space: pre-line; line-height: 1.9; margin-bottom: 2rem; }
    .al-h { font-size: 1.15rem; margin: 2.4rem 0 1rem; display: flex; align-items: center; gap: .6rem; }
    .al-h::before { content: ''; width: 4px; height: 1.1em; background: var(--red); border-radius: 2px; }
    .al-show { position: relative; border-radius: 16px; overflow: hidden; background: #000; }
    .al-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .al-track::-webkit-scrollbar { display: none; }
    .al-track figure { flex: 0 0 100%; scroll-snap-align: start; margin: 0; height: min(calc(min(1120px, 92vw) * .6), 72vh); position: relative; overflow: hidden; cursor: zoom-in; display: grid; place-items: center; }
    .al-track figure::before { content: ''; position: absolute; inset: -30px; background: var(--bg) center/cover; filter: blur(28px) brightness(.45); }
    .al-track img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
    .al-track figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.4rem 1.2rem 1rem; background: linear-gradient(0deg, rgba(0,0,0,.8), transparent); font-weight: 700; }
    .al-nav svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .al-nav { z-index: 2; position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 1.8rem; cursor: pointer; display: grid; place-items: center; transition: background .2s; }
    .al-nav:hover { background: var(--red); }
    .al-go-prev { left: 14px; } .al-go-next { right: 14px; }
    .al-count { z-index: 2; position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,.6); border-radius: 999px; padding: .2rem .7rem; font-size: .8rem; font-weight: 700; }
    .al-show.one .al-nav, .al-show.one .al-count { display: none; }
    .al-thumbs { display: flex; gap: .5rem; overflow-x: auto; padding: .7rem 0 .2rem; scrollbar-width: none; }
    .al-thumbs::-webkit-scrollbar { display: none; }
    .al-thumbs button { flex: 0 0 84px; aspect-ratio: 1; border-radius: 10px; border: 2px solid transparent; background: #222 center/cover; cursor: pointer; opacity: .5; transition: opacity .2s, border-color .2s; padding: 0; }
    .al-thumbs button.on, .al-thumbs button:hover { opacity: 1; border-color: var(--red); }
    .al-empty { color: var(--muted); padding: 4rem 0; text-align: center; }
    .al-wrap .reels { justify-content: flex-start; }
    .al-next { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .al-next a { position: relative; aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; background: #1c1c1c center/cover; display: flex; align-items: flex-end; padding: .8rem; font-weight: 900; }
    .al-next a::before { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.75), transparent 60%); }
    .al-next a span { position: relative; }
    @media (max-width: 760px) { .al-track figure { height: min(calc(92vw * 1.15), 68vh); } .al-nav { display: none; } .al-thumbs button { flex-basis: 60px; } }
  </style>
</head>
<body>
<header class="nav scrolled" id="nav">
  <a href="/" class="nav-brand"><img src="img/logo-bear.png" alt="突破重圍 Logo"><span>突破<em>重圍</em></span></a>
  <a href="/#booking" class="btn btn-sm">預約私人課</a>
</header>
<main class="al-wrap">
  <a href="/#private" class="btn btn-ghost btn-sm al-back">← 回首頁</a>
  <div id="alBody"><p class="al-empty">讀取中…</p></div>
</main>
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-x" data-lb="close" aria-label="關閉">✕</button>
  <button class="lb-nav lb-prev" data-lb="prev" aria-label="上一張">‹</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="lb-nav lb-next" data-lb="next" aria-label="下一張">›</button>
</div>
<script src="data.js?v=202611081635"></script>
<script src="reels.js?v=202611081635"></script>
  <script type="module" src="album.js?v=202611081635"></script>
</body>
</html>
